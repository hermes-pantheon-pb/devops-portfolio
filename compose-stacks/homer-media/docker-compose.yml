# ==============================================================================
# MicroVM Stack: Homer-Media_server
# Purpose: Hardware-accelerated media streaming, audio server, and library indexing
# Optimizations: SR-IOV / Intel QuickSync passthrough, Intel Optane SQLite DB caching, read-only media mounts
# ==============================================================================

services:
  jellyfin_new:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin_new
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    devices:
      # Passthrough de nó de renderização da iGPU (SR-IOV / Intel QuickSync)
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "991"
    volumes:
      - /mnt/metadata_drive/jellyfin_new/config:/config
      - /mnt/metadata_drive/jellyfin_new/cache:/cache
      - type: bind
        source: /mnt/mnemosyneomv_MSataP_media
        target: /media
      # Fontes customizadas para renderização/burn-in de legendas em tempo real
      - type: bind
        source: /mnt/metadata_drive/jellyfin_new/cache/fonts
        target: /usr/local/share/fonts/custom
        read_only: true

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - ND_ENABLEINSIGHTSCOLLECTOR=false
    volumes:
      - /mnt/metadata_drive/navidrome/data:/data
      # Biblioteca de música montada estritamente como somente-leitura (:ro)
      - /mnt/mnemosyneomv_MSataP_media/music:/music:ro

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - VERSION=docker
    volumes:
      - /mnt/metadata_drive/plex/config:/config
      - /mnt/metadata_drive/plex/transcoding:/transcode
      # The Injection Layer: Operações SQLite de latência quase zero sobre Intel Optane 8GB
      - "/mnt/optane_db/plex/Databases:/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases"
      - /mnt/mnemosyneomv_MSataP_media:/media
