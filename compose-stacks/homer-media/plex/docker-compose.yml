# ==============================================================================
# MicroVM: Homer-Media_server | Stack: Plex Media Server
# Purpose: High-performance Plex server with Intel Optane ultra-fast SQLite caching
# ==============================================================================

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      - VERSION=docker
    volumes:
      - /mnt/metadata_drive/plex/config:/config
      - /mnt/metadata_drive/plex/transcoding:/transcode
      # The Injection Layer: Operações SQLite de latência quase zero sobre Intel Optane 8GB
      - "/mnt/optane_db/plex/Databases:/config/Library/Application Support/Plex Media Server/Plug-in Support/Databases"
      - /mnt/mnemosyneomv_MSataP_media:/media
