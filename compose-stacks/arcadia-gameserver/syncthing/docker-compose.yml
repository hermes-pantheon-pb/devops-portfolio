# ==============================================================================
# MicroVM: Arcadia_GameServer | Stack: Syncthing
# Purpose: Replicates Crafty Controller world backups to the central storage cluster
# ==============================================================================

services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: arcadia-syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /opt/docker/syncthing/config:/config
      # Sincroniza diretamente a pasta de backups do Crafty da MicroVM
      - /opt/docker/crafty/backups:/crafty_backups
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
