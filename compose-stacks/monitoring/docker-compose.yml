services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.13-debian
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - UPTIME_KUMA_DISABLE_FRAME_SAMEORIGIN=1
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3001\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.10.0/24

volumes:
  uptime-kuma-data:
    driver: local
