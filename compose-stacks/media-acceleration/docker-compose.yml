services:
  media-server:
    image: lscr.io/linuxserver/jellyfin:10.9.11
    container_name: media-server
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
      # Intel QuickSync / VAAPI Hardware Acceleration
      - DOCKER_MODS=linuxserver/mods:jellyfin-opencl-intel
    devices:
      # Passthrough de render node da GPU (SR-IOV / Intel iGPU passthrough via Proxmox)
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    volumes:
      - media-config:/config
      # Ponto de montagem gerenciado via systemd/NFS conectado à VM de armazenamento
      - /mnt/storage/media:/data/media:ro
    ports:
      - "8096:8096"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    networks:
      - internal-media-net

networks:
  internal-media-net:
    driver: bridge

volumes:
  media-config:
    driver: local
