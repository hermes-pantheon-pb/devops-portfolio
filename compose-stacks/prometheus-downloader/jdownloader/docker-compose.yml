# ==============================================================================
# MicroVM: Prometheus_downloader | Stack: JDownloader-2
# Purpose: Headless download manager with web interface
# ==============================================================================

services:
  jdownloader-2:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader-2
    restart: unless-stopped
    ports:
      - "5800:5800"
    volumes:
      - /opt/docker/downloads/jdownloader/config:/config:rw
      - /mnt/mnemosyneomv_MSataP_data:/output:rw
