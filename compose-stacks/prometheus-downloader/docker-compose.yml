# ==============================================================================
# MicroVM Stack: Prometheus_downloader
# Purpose: Remote download management and Plex telemetry / analytics monitoring
# ==============================================================================

services:
  jdownloader-2:
    image: jlesage/jdownloader-2:latest
    container_name: jdownloader-2
    restart: unless-stopped
    ports:
      - "5800:5800"
    volumes:
      - /opt/docker/downloads/jdownloader/config:/config:rw
      - /mnt/mnemosyneomv_MSataP_data:/output:rw

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /mnt/metadata_drive/tautulli/config:/config
    ports:
      - "8181:8181"
